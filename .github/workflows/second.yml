name: second
on: push
jobs:
    say-time:
        runs-on: ubuntu-latest
        steps:
            - run: echo "start second CI"
            - run: date
            - run: whoami
            - run: echo "end second CI"
    good-bye:
        runs-on: ubuntu-latest
        needs: say-time
        steps:
            - run: echo " bye jawad"
    colors:
        runs-on: ubuntu-latest
        strategy:
            matrix:
              color: [red, blue]
        steps:
        - run: echo "color is ${{ matrix.color }}"
        
    cache-demo:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/cache@v4
              with:
                path: my-cache
                key: demo-v1
            - run: mkdir -p my-cache
            - run: date >> my-cache/time.txt
            - run: cat my-cache/time.txt