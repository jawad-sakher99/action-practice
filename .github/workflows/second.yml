name: second
on: push
jobs:
    say-time:
        runs-on: ubuntu-latest
        steps:
            - run: echo "start second CI"
            - run: date
            - run: whoami
            - run: echo "end second CI"
    good-bye:
        runs-on: ubuntu-latest
        needs: say-time
        steps:
            - run: echo " bye jawad againe"
    colors:
        runs-on: ubuntu-latest
        strategy:
            matrix:
              color: [red, blue]
        steps:
        - run: echo "color is ${{ matrix.color }}"
        
    cache-demo:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/cache@v4
              with:
                path: my-cache
                key: demo-${{ hashFiles('deps.txt') }}
            - run: mkdir -p my-cache
            - run: date >> my-cache/time.txt
            - run: cat my-cache/time.txt

    db-test:
        runs-on: ubuntu-latest
        services:
            db:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: test
                ports:
                    - 5432:5432
        steps:
            - run: pg_isready -h localhost -p 5432
